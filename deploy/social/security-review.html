<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Security review</title>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500&family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1200px;height:675px;overflow:hidden}
body{position:relative;font-family:"Inter Tight",sans-serif;color:#fff;
  background:
    radial-gradient(ellipse 620px 420px at 50% 34%, #EE927A 0%, rgba(238,146,122,0) 70%),
    linear-gradient(180deg,#D8634A 0%,#E36F55 55%,#E77C61 100%)}
.cloud{position:absolute;border-radius:50%;background:#FBEDE6;filter:blur(26px)}
.frame{position:absolute;inset:18px;border:2px solid rgba(255,255,255,.75);border-radius:3px}
.logo{position:absolute;left:48px;top:46px;width:62px;height:62px;border-radius:16px;background:rgba(255,255,255,.14);display:grid;place-items:center}
.logo svg{width:34px;height:34px}
.url{position:absolute;right:50px;top:62px;font-size:24px;font-weight:500}
.kicker{position:absolute;top:118px;width:100%;text-align:center;font-size:20px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;opacity:.92}
h1{position:absolute;top:152px;width:100%;text-align:center;font:400 104px/1 "Bodoni Moda",serif;text-shadow:0 4px 30px rgba(120,40,20,.18)}
.sub{position:absolute;top:276px;width:100%;text-align:center;font:500 34px/1.2 "Bodoni Moda",serif;letter-spacing:.02em}
.row{position:absolute;top:348px;left:0;right:0;display:flex;justify-content:center;gap:22px}
.card{width:250px;height:150px;border-radius:22px;background:rgba(255,255,255,.93);color:#2A1630;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;box-shadow:0 18px 40px rgba(120,40,20,.18)}
.ic{position:relative;width:62px;height:62px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 0 0 1px #F1E4DE}
.ic svg{width:34px;height:34px}
.ic img.mk{width:58%;height:58%;object-fit:contain}
.ic.full img.mk{width:100%;height:100%;border-radius:50%}
.ic img.rh{position:absolute;right:-4px;bottom:-4px;width:24px;height:24px;border-radius:50%;box-shadow:0 0 0 2px #fff}
.card b{font-size:26px;font-weight:700;letter-spacing:.01em}
.card span{font-size:15px;color:#7A6A7E;margin-top:-6px}
.pill{position:absolute;top:540px;left:50%;transform:translateX(-50%);white-space:nowrap;padding:13px 28px;border-radius:999px;background:#D95A42;border:1.5px solid rgba(255,255,255,.65);font-size:21px;font-weight:500;box-shadow:0 10px 26px rgba(120,40,20,.22)}
.pill i{font-style:normal;opacity:.7;margin:0 10px}
</style>
</head>
<body>
<div class="cloud" style="left:-80px;top:520px;width:420px;height:220px"></div>
<div class="cloud" style="left:260px;top:585px;width:380px;height:170px"></div>
<div class="cloud" style="left:600px;top:575px;width:420px;height:190px"></div>
<div class="cloud" style="left:930px;top:505px;width:400px;height:230px"></div>
<div class="cloud" style="left:-60px;top:-120px;width:300px;height:180px;opacity:.25"></div>
<div class="cloud" style="left:980px;top:-110px;width:320px;height:180px;opacity:.22"></div>
<div class="frame"></div>
<div class="logo"><svg viewBox="0 0 32 32"><path d="M23.5 9.2A9.5 9.5 0 1 0 23.5 22.8" fill="none" stroke="#fff" stroke-width="5.2" stroke-linecap="round"/><circle cx="25.2" cy="16" r="2.6" fill="#fff"/></svg></div>
<div class="url">cirrava.xyz</div>
<div class="kicker">Security update</div>
<h1>Under review</h1>
<div class="sub">Security review by HEY Research Lab</div>
<div class="row">
  <div class="card"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#E0664A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 7 3 12l5 5M16 7l5 5-5 5"/></svg></div><b>Open source</b><span>Public on GitHub</span></div>
  <div class="card"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#2F8F5B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></svg></div><b>26 contracts</b><span>Verified on Sourcify</span></div>
  <div class="card"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#B7791F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v5h-5"/></svg></div><b>v2</b><span>In retest now</span></div>
</div>
<div class="pill">@HeyResearch<i>·</i>github.com/cirrava/cirrava-xyz</div>
</body>
</html>
