# Clean URLs for cirrava.xyz (no # in the address bar).
# Included inside the cirrava.xyz server block by install.sh.
#   /docs, /docs/<section>          → docs.html   (the page scrolls to <section>)
#   /app, /app/earn, /app/borrow…   → app/index.html (the app picks the tab from the path)
#   /docs.html                      → 301 /docs
location = /docs.html { return 301 /docs$is_args$args; }
location = /docs { expires -1; try_files /docs.html =404; }
location /docs/ { expires -1; try_files /docs.html =404; }
location = /app { return 301 /app/earn; }
location /app/ { expires -1; try_files $uri /app/index.html; }
