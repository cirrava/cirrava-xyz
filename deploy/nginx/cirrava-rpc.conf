# Read-only JSON-RPC proxy: cirrava.xyz/rpc → Robinhood Chain mainnet.
# Lets the app read the chain for visitors whose ISP blocks the public RPC (e.g. Internet Positif).
# Included inside the cirrava.xyz server block by install.sh. The rate-limit zone lives in
# /etc/nginx/conf.d/cirrava-ratelimit.conf (http context).
location = /rpc {
    limit_except POST OPTIONS { deny all; }
    limit_req zone=cirrava_rpc burst=40 nodelay;
    limit_req_status 429;
    client_max_body_size 64k;

    proxy_pass https://rpc.mainnet.chain.robinhood.com/;
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_set_header Host rpc.mainnet.chain.robinhood.com;
    proxy_set_header Content-Type application/json;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 20s;
}
