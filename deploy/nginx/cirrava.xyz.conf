# Nginx site for cirrava.xyz — static files from /var/www/cirrava
# Install: sudo cp cirrava.xyz.conf /etc/nginx/sites-available/cirrava.xyz
#          sudo ln -s /etc/nginx/sites-available/cirrava.xyz /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
# Then:    sudo certbot --nginx -d cirrava.xyz -d www.cirrava.xyz --redirect
#          (certbot adds the HTTPS listener and the http→https redirect to this file)

# www → apex (one canonical host). The ACME path stays reachable so certbot can verify www too.
server {
    listen 80;
    listen [::]:80;
    server_name www.cirrava.xyz;
    location ^~ /.well-known/acme-challenge/ { root /var/www/cirrava; }
    location / { return 301 https://cirrava.xyz$request_uri; }
}

server {
    listen 80;
    listen [::]:80;
    server_name cirrava.xyz;

    root /var/www/cirrava;
    include /etc/nginx/snippets/cirrava-rpc.conf;
    include /etc/nginx/snippets/cirrava-routes.conf;
    index index.html;

    # ---- security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    # Three.js + ethers come from jsDelivr, fonts from Google; the app talks to its RPC over https.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://cdn.jsdelivr.net https:; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # ---- compression
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript text/javascript application/json image/svg+xml application/xml text/xml;

    # ---- caching: HTML always revalidates, assets cache for a week.
    # Only `expires` here: an add_header inside a location would drop every security header above.
    location ~* \.(?:jpg|jpeg|png|webp|svg|ico|woff2?)$ {
        expires 7d;
        try_files $uri =404;
    }
    location ~* \.(?:js|css)$ {
        expires 1h;
        try_files $uri =404;
    }

    location / {
        expires -1;   # Cache-Control: no-cache
        try_files $uri $uri/ =404;
    }

    # never serve dotfiles — except Let's Encrypt's verification path
    location ^~ /.well-known/acme-challenge/ { try_files $uri =404; }
    location ~ /\. { deny all; }

    error_page 404 /404.html;
}
